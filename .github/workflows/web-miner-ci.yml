name: Web Miner CI

on:
  push:
    branches: [ main, feature/web-miner ]
    paths:
      - 'web/**'
      - 'shared/mining-profile/**'
      - 'shared/pool-registry/**'
      - 'shared/session-state/**'
      - 'shared/hardware-capability/**'
      - 'shared/randomx-memory/**'
      - 'shared/auto-tune/**'
      - 'shared/reconnect/**'
      - 'shared/wallet-address/**'
      - 'shared/session-runtime/**'
      - 'shared/daemon-endpoint/**'
      - 'shared/fee-manifest/**'
      - 'shared/pool-recommend/**'
      - 'shared/p2pool-connect/**'
      - 'shared/desktop-optimize/**'
      - 'shared/cpu-topology/**'
      - 'shared/thermal-policy/**'
      - 'shared/power-policy/**'
      - 'shared/diagnostics/**'
      - 'shared/ios-capability/**'
      - 'shared/release-capability/**'
      - 'shared/gpu-capability/**'
      - 'shared/energy-ledger/**'
      - 'shared/electricity-tariff/**'
      - 'shared/ambient-clock/**'
      - 'shared/economy-snapshot/**'
      - 'shared/automation-policy/**'
      - 'shared/desktop-idle-policy/**'
      - 'app/src/main/assets/pools.json'
      - 'desktop/src/generated-pool-configs.json'
      - 'desktop/src/main.js'
      - '.github/workflows/web-miner-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'shared/mining-profile/**'
      - 'shared/pool-registry/**'
      - 'shared/session-state/**'
      - 'shared/hardware-capability/**'
      - 'shared/randomx-memory/**'
      - 'shared/auto-tune/**'
      - 'shared/reconnect/**'
      - 'shared/wallet-address/**'
      - 'shared/session-runtime/**'
      - 'shared/daemon-endpoint/**'
      - 'shared/fee-manifest/**'
      - 'shared/pool-recommend/**'
      - 'shared/p2pool-connect/**'
      - 'shared/desktop-optimize/**'
      - 'shared/energy-ledger/**'
      - 'shared/ambient-clock/**'
      - 'shared/economy-snapshot/**'
      - 'shared/automation-policy/**'
      - 'shared/desktop-idle-policy/**'
      - 'shared/cpu-topology/**'
      - 'shared/thermal-policy/**'
      - 'shared/power-policy/**'
      - 'shared/diagnostics/**'
      - 'shared/ios-capability/**'
      - 'shared/release-capability/**'
      - 'shared/gpu-capability/**'
      - 'shared/electricity-tariff/**'
      - 'app/src/main/assets/pools.json'
      - 'desktop/src/generated-pool-configs.json'
      - 'desktop/src/main.js'

jobs:
  lint-and-build:
    name: Lint and Build Web Miner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (if configured)
        run: npm run lint --if-present

      - name: Run unit / harness tests (#25/#64)
        run: npm test

      - name: MiningProfile contract tests (#30)
        working-directory: .
        run: node --test shared/mining-profile/test/*.test.js

      - name: Pool registry contract tests (#40/#41)
        working-directory: .
        run: node --test shared/pool-registry/test/*.test.js

      - name: Session state machine tests (#48)
        working-directory: .
        run: node --test shared/session-state/test/*.test.js

      - name: Hardware capability contract tests (#33)
        working-directory: .
        run: node --test shared/hardware-capability/test/*.test.js

      - name: RandomX memory budget tests (#35)
        working-directory: .
        run: node --test shared/randomx-memory/test/*.test.js

      - name: Auto-tune contract tests (#34)
        working-directory: .
        run: node --test shared/auto-tune/test/*.test.js

      - name: Wallet address validation tests (#53)
        working-directory: .
        run: node --test shared/wallet-address/test/*.test.js

      - name: Reconnect / failover contract tests (#43)
        working-directory: .
        run: node --test shared/reconnect/test/*.test.js

      - name: Daemon endpoint parse/probe tests (#44)
        working-directory: .
        run: node --test shared/daemon-endpoint/test/*.test.js

      - name: Fee transparency manifest tests (#63)
        working-directory: .
        run: node --test shared/fee-manifest/test/*.test.js

      - name: Session runtime ownership / nonce tests (#49)
        working-directory: .
        run: node --test shared/session-runtime/test/*.test.js

      - name: Pool recommend / share-wait tests (#42)
        working-directory: .
        run: node --test shared/pool-recommend/test/*.test.js

      - name: P2Pool connect-existing tests (#45)
        working-directory: .
        run: node --test shared/p2pool-connect/test/*.test.js

      - name: Desktop optimize matrix tests (#37)
        working-directory: .
        run: node --test shared/desktop-optimize/test/*.test.js

      - name: CPU topology / affinity tests (#36)
        working-directory: .
        run: node --test shared/cpu-topology/test/*.test.js

      - name: Thermal policy tests (#38)
        working-directory: .
        run: node --test shared/thermal-policy/test/*.test.js

      - name: Power / convenience policy tests (#39)
        working-directory: .
        run: node --test shared/power-policy/test/*.test.js

      - name: Diagnostics error/log/redact tests (#55)
        working-directory: .
        run: node --test shared/diagnostics/test/*.test.js

      - name: iOS capability / JIT gate tests (#60)
        working-directory: .
        run: node --test shared/ios-capability/test/*.test.js

      - name: Release capability manifest gate (#64)
        working-directory: .
        run: node --test shared/release-capability/test/*.test.js

      - name: GPU capability visibility fixtures (#65)
        working-directory: .
        run: node --test shared/gpu-capability/test/*.test.js

      - name: Companion sync contract (#62)
        working-directory: .
        run: node --test shared/companion-sync/test/*.test.js

      - name: Onboarding flow contract (#56)
        working-directory: .
        run: node --test shared/onboarding/test/*.test.js

      - name: Staged apply / advanced controls (#57)
        working-directory: .
        run: node --test shared/staged-apply/test/*.test.js

      - name: A11y viewport / contrast helpers (#58)
        working-directory: .
        run: node --test shared/a11y/test/*.test.js

      - name: i18n terminology catalog (#59)
        working-directory: .
        run: node --test shared/i18n/test/*.test.js

      - name: Artifact smoke + evidence catalog (#64)
        working-directory: .
        run: node --test shared/artifact-smoke/test/*.test.js

      - name: Energy ledger / kWh accounting (#70)
        working-directory: .
        run: node --test shared/energy-ledger/test/*.test.js

      - name: Electricity tariff calculator (#71)
        working-directory: .
        run: node --test shared/electricity-tariff/test/*.test.js

      - name: Ambient clock policy (#74)
        working-directory: .
        run: node --test shared/ambient-clock/test/*.test.js

      - name: Economy snapshot / accrual (#72)
        working-directory: .
        run: node --test shared/economy-snapshot/test/*.test.js

      - name: Automation policy / budget gates (#73)
        working-directory: .
        run: node --test shared/automation-policy/test/*.test.js

      - name: Desktop idle / tray / close policy (#77)
        working-directory: .
        run: node --test shared/desktop-idle-policy/test/*.test.js

      - name: Build for Production
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-miner-dist
          path: web/dist/
          retention-days: 7

  proxy-check:
    name: Check Proxy Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/proxy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Proxy Dependencies
        run: npm ci

      - name: Check Proxy Syntax
        run: node --check server.js

      - name: Run Proxy Fee Tests
        run: npm test
