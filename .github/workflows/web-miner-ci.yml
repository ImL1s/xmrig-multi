name: Web Miner CI

on:
  push:
    branches: [ main, feature/web-miner ]
    paths:
      - 'web/**'
      - 'shared/mining-profile/**'
      - 'shared/pool-registry/**'
      - 'app/src/main/assets/pools.json'
      - 'desktop/src/generated-pool-configs.json'
      - 'desktop/src/main.js'
      - '.github/workflows/web-miner-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'shared/mining-profile/**'
      - 'shared/pool-registry/**'
      - 'app/src/main/assets/pools.json'
      - 'desktop/src/generated-pool-configs.json'
      - 'desktop/src/main.js'

jobs:
  lint-and-build:
    name: Lint and Build Web Miner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (if configured)
        run: npm run lint --if-present

      - name: Run unit / harness tests (#25/#64)
        run: npm test

      - name: MiningProfile contract tests (#30)
        working-directory: .
        run: node --test shared/mining-profile/test/*.test.js

      - name: Pool registry contract tests (#40/#41)
        working-directory: .
        run: node --test shared/pool-registry/test/*.test.js

      - name: Build for Production
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-miner-dist
          path: web/dist/
          retention-days: 7

  proxy-check:
    name: Check Proxy Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/proxy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Proxy Dependencies
        run: npm ci

      - name: Check Proxy Syntax
        run: node --check server.js

      - name: Run Proxy Fee Tests
        run: npm test
