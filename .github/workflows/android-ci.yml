name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'web/**'
      - 'ios/**'
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'web/**'
      - 'ios/**'
      - '**.md'

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for Gradle
      run: chmod +x gradlew

    - name: Check XMRig binary packaging
      run: |
        if [ -f app/src/main/jniLibs/arm64-v8a/libxmrig.so ] || [ -f app/src/main/assets/xmrig_arm64 ]; then
          echo "XMRig binary present"
        else
          echo "::error::libxmrig.so / xmrig_arm64 missing — debug APK cannot mine; refusing green CI (#133)"
          exit 1
        fi

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Build Wear OS Debug
      run: ./gradlew :wearos:assembleDebug

    - name: Run Unit Tests (includes consumer integration suites)
      run: ./gradlew :app:testDebugUnitTest

    - name: Consumer suites must stay wired (#130/#124/#126)
      run: |
        ./gradlew :app:testDebugUnitTest --tests '*EnergyBudgetIntegrationTest*' --tests '*PowerSettingsGateTest*' --tests '*MiningControllerSessionSequenceTest*'

    - name: Run Android Lint
      run: ./gradlew :app:lintDebug

    - name: Upload lint reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-lint-report
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml
        if-no-files-found: ignore
