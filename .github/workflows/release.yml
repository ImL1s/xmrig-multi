on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Keep in sync with app/wear versionName and desktop/web package versions.
  APP_VERSION: ${{ github.ref_name }}

jobs:
  android:
    name: Android + Wear APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: false

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Stage XMRig
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build_xmrig.sh
          if [ -f app/src/main/assets/xmrig_arm64 ]; then
            echo "Using tracked app/src/main/assets/xmrig_arm64 (repo 1% fee wallet)"
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp app/src/main/assets/xmrig_arm64 app/src/main/jniLibs/arm64-v8a/libxmrig.so
            chmod 755 app/src/main/jniLibs/arm64-v8a/libxmrig.so
          else
            ./scripts/build_xmrig.sh
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Keystore written"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is not set; assembling unsigned release APKs"
          fi

      - name: Build Release APKs
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/app/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libxmrig.so ] && [ ! -f app/src/main/assets/xmrig_arm64 ]; then
            echo "XMRig binary missing after scripts/build_xmrig.sh"
            exit 1
          fi
          ./gradlew :app:stageXmrigJniLib :app:assembleRelease :wearos:assembleRelease

      - name: Package Android artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-out/xmrig-multi-android-${VER}.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-out/xmrig-multi-android-${VER}-unsigned.apk"
          fi
          WEAR=$(ls wearos/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1 || true)
          if [ -n "$WEAR" ]; then
            BASE=$(basename "$WEAR")
            if echo "$BASE" | grep -qi unsigned; then
              cp "$WEAR" "release-out/xmrig-multi-wearos-${VER}-unsigned.apk"
            else
              cp "$WEAR" "release-out/xmrig-multi-wearos-${VER}.apk"
            fi
          fi
          ls -la release-out

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-wear
          path: release-out/*
          if-no-files-found: error

  web:
    name: Web miner + proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/proxy/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install proxy deps
        working-directory: web/proxy
        run: npm ci

      - name: Package web artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-out
          (cd web/dist && zip -r "../../release-out/xmrig-multi-web-${VER}.zip" .)
          (cd web/proxy && zip -r "../../release-out/xmrig-multi-web-proxy-${VER}.zip" . -x "node_modules/*")
          ls -la release-out

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: release-out/*
          if-no-files-found: error

  desktop-linux:
    name: Desktop Linux (deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Stage tracked Linux XMRig sidecar
        run: |
          BIN=desktop/src-tauri/binaries
          if [ ! -f "$BIN/xmrig-x86_64-unknown-linux-gnu" ]; then
            echo "Tracked Linux XMRig sidecar missing"
            exit 1
          fi
          # Tauri also accepts a plain name during local runs.
          cp "$BIN/xmrig-x86_64-unknown-linux-gnu" "$BIN/xmrig"
          chmod 755 "$BIN/xmrig" "$BIN/xmrig-x86_64-unknown-linux-gnu"

      - name: Build Tauri (deb)
        working-directory: desktop
        env:
          NO_STRIP: true
        run: |
          npm install
          npx tauri build --bundles deb

      - name: Package desktop Linux artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-out
          DEB=$(ls desktop/src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -n1 || true)
          if [ -z "$DEB" ]; then
            echo "No .deb produced"
            exit 1
          fi
          cp "$DEB" "release-out/xmrig-multi-desktop-linux-${VER}.deb"
          ls -la release-out

      - name: Upload desktop Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release-out/*
          if-no-files-found: error

  desktop-windows:
    name: Desktop Windows (NSIS)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build XMRig sidecar (custom fee)
        shell: bash
        run: |
          chmod +x desktop/scripts/build-xmrig.sh
          ./desktop/scripts/build-xmrig.sh
          ls -la desktop/src-tauri/binaries/

      - name: Build Tauri (NSIS)
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx tauri build --bundles nsis

      - name: Package desktop Windows artifacts
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-out
          EXE=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -n1 || true)
          if [ -z "$EXE" ]; then
            echo "No NSIS installer produced"
            exit 1
          fi
          cp "$EXE" "release-out/xmrig-multi-desktop-windows-${VER}-setup.exe"
          ls -la release-out

      - name: Upload desktop Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release-out/*
          if-no-files-found: error

  desktop-macos:
    name: Desktop macOS (DMG)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: brew install cmake || true

      - name: Build XMRig sidecar (custom fee)
        run: |
          chmod +x desktop/scripts/build-xmrig.sh
          ./desktop/scripts/build-xmrig.sh
          ls -la desktop/src-tauri/binaries/

      - name: Build Tauri (DMG)
        working-directory: desktop
        run: |
          npm install
          npx tauri build --bundles dmg

      - name: Package desktop macOS artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-out
          DMG=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -n1 || true)
          if [ -z "$DMG" ]; then
            echo "No DMG produced"
            exit 1
          fi
          cp "$DMG" "release-out/xmrig-multi-desktop-macos-${VER}.dmg"
          ls -la release-out

      - name: Upload desktop macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release-out/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [android, web, desktop-linux, desktop-windows, desktop-macos]
    if: ${{ always() && needs.android.result == 'success' && needs.web.result == 'success' && needs.desktop-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -print -exec cp {} release-files/ \;
          ls -la release-files
          test -n "$(ls -A release-files)"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: false
          name: XMRig Multi ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## XMRig Multi ${{ github.ref_name }}

            Multi-platform build. Version strings are aligned at **${{ github.ref_name }}** across Android, WearOS, Desktop, Web, iOS, and watchOS sources.

            ### Attached (when CI succeeded)
            - **Android** / **WearOS** APKs
            - **Web** UI zip + WebSocket proxy zip
            - **Desktop** Linux `.deb`, Windows NSIS installer, macOS `.dmg`

            ### Not attached from CI
            - **iOS** / **watchOS**: sideload locally (App Store mining ban). See `docs/ios.md` / `docs/platforms.md`.

            Signing secrets may be unset → Android/Wear assets can be `*-unsigned.apk`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
