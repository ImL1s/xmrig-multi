on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Keystore written"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is not set; assembling an unsigned release APK"
          fi

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libxmrig.so ] && [ ! -f app/src/main/assets/xmrig_arm64 ]; then
            echo "XMRig binary missing (need jniLibs libxmrig.so or assets/xmrig_arm64)"
            exit 1
          fi
          # API 29+ cannot exec from filesDir; :app:stageXmrigJniLib copies the
          # tracked asset into packaged jniLibs when libxmrig.so is absent.
          ./gradlew :app:stageXmrigJniLib :app:assembleRelease :wearos:assembleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          fail_on_unmatched_files: false
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
